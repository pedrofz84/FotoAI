# Servidor Qdrant para o FotoAI.
# Arrancar:  docker compose up -d
# Os vetores ficam em ./qdrant_storage (fora do git). O motor liga-se a http://127.0.0.1:6333
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: fotoai-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
